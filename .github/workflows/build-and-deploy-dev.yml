name: Build and deploy to dev
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-and-deploy-dev.yml"
      - ".nais/dev.yaml"
      - "Dockerfile"
      - "pom.xml"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-and-deploy-dev.yml"
      - ".nais/dev.yaml"
      - "Dockerfile"
      - "pom.xml"
      - "src/**"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Verify and build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # ratchet:actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build with Maven
        run: mvn -B --no-transfer-progress verify
      - uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795 # ratchet:nais/docker-build-push@v0
        if: github.event_name != 'pull_request'
        id: docker-push
        with:
          team: grunn-og-hjelp
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
  deploy:
    name: Deploy to dev
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/dev.yaml
          IMAGE: ${{ needs.build.outputs.image }}
