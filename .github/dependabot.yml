version: 2

multi-ecosystem-groups:
  dependencies:
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"

updates:
  - package-ecosystem: "maven"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
